# Docker Compose file for building, testing, and pushing your model.
#
# 1. Copy .env.example to .env and fill in your values.
# 2. Build the image:                   docker compose build
# 3. Test against sample data:          docker compose run --rm model
# 4. Push to the Synapse registry:      docker compose push
#
# All image, build, and resource settings are controlled via the .env file.

services:
  model:
    build:
      context: ${DOCKERFILE_FOLDER:-python}
      dockerfile: Dockerfile
      platforms:
        - linux/amd64
    image: ${IMAGE}
    network_mode: none
    volumes:
      - ${INPUT_DIR}:/input:ro
      - ${OUTPUT_DIR}:/output:rw
    mem_limit: ${MEMORY_LIMIT:-4g}
    memswap_limit: ${MEMORY_SWAP_LIMIT:-6g}
    shm_size: ${SHM_SIZE:-1g}
    restart: "no"
